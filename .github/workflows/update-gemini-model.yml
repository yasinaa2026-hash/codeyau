name: Update Gemini model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update deprecated Gemini model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('app.js'), Path('index.html')]
          changed = False
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              new = text.replace('gemini-2.0-flash', 'gemini-3.6-flash')
              new = new.replace('codeyau-gemini-model', 'codeyau-gemini-model-v2')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed = True
          if not changed:
              print('No Gemini migration needed.')
          PY

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'fix: migrate Gemini 2.0 to Gemini 3.6 Flash'
          git push
