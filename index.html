<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="codeyau - browser IDE with AI assistant">
<meta name="theme-color" content="#0f172a">
<title>codeyau — Online IDE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
html,body{margin:0;min-height:100%}.CodeMirror{height:100%!important;font-family:"Fira Code",monospace!important;font-size:14px;line-height:1.6}.CodeMirror-gutters{background:#0f172a!important;border-right:1px solid #1e293b!important}.CodeMirror-linenumber{color:#64748b!important}.CodeMirror-activeline-background{background:rgba(99,102,241,.08)!important}.light .CodeMirror-gutters{background:#f8fafc!important;border-right-color:#cbd5e1!important}.sidebar-collapsed{width:0!important;overflow:hidden}.modal-backdrop{background:rgba(2,6,23,.74);backdrop-filter:blur(6px)}.panel-scroll{scrollbar-width:thin}.ai-message{white-space:pre-wrap}.code-highlight{border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.06)}

<body id="app" class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">
<header class="h-16 shrink-0 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 sm:px-4 gap-3 z-30">
  <div class="flex items-center gap-2 min-w-0">
    <button id="menuBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700" title="Files"><i class="fa-solid fa-bars"></i></button>
    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg"><i class="fa-solid fa-code text-lg"></i></div>
    <div class="font-bold text-xl bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">codeyau</div>
    <span class="hidden sm:inline text-[11px] px-2 py-1 rounded-full bg-indigo-500/15 text-indigo-300">Browser IDE</span>
  </div>
  <div class="flex items-center gap-1.5 shrink-0">
    <select id="language" class="max-w-[150px] bg-slate-800 text-slate-200 text-sm rounded-lg px-2.5 py-2 border border-slate-700"><option value="python">Python 3</option><option value="javascript">JavaScript</option><option value="cpp">C++</option><option value="java">Java</option><option value="html">HTML / CSS / JS</option></select>
    <button id="aiBtn" class="px-3 py-2 bg-violet-600 hover:bg-violet-500 rounded-lg text-sm font-medium"><i class="fa-solid fa-wand-magic-sparkles"></i><span class="hidden sm:inline"> AI</span></button>
    <button id="accountBtn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm"><i class="fa-regular fa-user"></i><span id="accountText" class="hidden sm:inline ml-1">Sign in</span></button>
    <button id="settingsBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg" title="Settings"><i class="fa-solid fa-gear"></i></button>
    <button id="themeBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg" title="Theme"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
    <button id="saveBtn" class="hidden md:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    <button id="exportBtn" class="hidden md:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm"><i class="fa-solid fa-download"></i> Export</button>
    <button id="shareBtn" class="hidden lg:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm"><i class="fa-solid fa-share-nodes"></i> Share</button>
    <button id="runBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-900 disabled:cursor-not-allowed rounded-lg font-semibold"><i class="fa-solid fa-play"></i> Run</button>
  </div>
</header>
<div class="flex-1 flex overflow-hidden min-h-0">
  <aside id="sidebar" class="w-64 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-200">
    <div class="p-3 border-b border-slate-800 flex items-center justify-between"><span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Project Files</span><button id="newFileBtn" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-plus"></i></button></div>
    <div id="fileList" class="flex-1 overflow-auto panel-scroll p-2 space-y-1"></div>
    <div class="p-2 border-t border-slate-800 grid grid-cols-3 gap-1"><button id="importBtn" class="py-2 bg-slate-800 hover:bg-slate-700 rounded text-xs" title="Import project"><i class="fa-solid fa-file-import"></i></button><button id="exportProjectBtn" class="py-2 bg-slate-800 hover:bg-slate-700 rounded text-xs" title="Export project"><i class="fa-solid fa-box-archive"></i></button><button id="resetBtn" class="py-2 bg-slate-800 hover:bg-slate-700 rounded text-xs hover:text-red-300" title="Reset"><i class="fa-solid fa-rotate-right"></i></button></div>
    <input id="importInput" type="file" accept="application/json,.json" hidden>

  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-w-0 bg-slate-950">
    <section class="flex-1 min-w-0 flex flex-col border-r border-slate-800">

      <div class="h-6 shrink-0 bg-slate-900 border-t border-slate-800 px-3 flex items-center justify-between text-[10px] text-slate-500"><div class="flex gap-3"><span id="statusFile">main.py</span><span id="statusLanguage">Python 3</span></div><div class="flex gap-3"><span id="statusPosition">Ln 1, Col 1</span><span id="statusStats">1 line</span></div></div>
    </section>
    <section id="outputSection" class="w-full lg:w-[28rem] shrink-0 bg-slate-900 flex flex-col min-h-0">
      <div class="h-12 shrink-0 bg-slate-800 border-b border-slate-700 px-4 flex items-center justify-between"><span class="text-xs font-semibold uppercase tracking-wider"><i class="fa-solid fa-terminal text-indigo-400 mr-2"></i>Output / Preview</span><div class="flex gap-1"><button id="consoleTab" class="px-2 py-1 text-xs rounded bg-slate-700">Console</button><button id="previewTab" class="hidden px-2 py-1 text-xs rounded bg-slate-700">Preview</button><button id="clearBtn" class="px-2 py-1 text-xs rounded bg-slate-700">Clear</button></div></div>
      <div id="console" class="flex-1 min-h-0 overflow-auto panel-scroll p-4 font-mono text-xs bg-slate-950"><div class="text-slate-500 italic">Ready. Run with Ctrl+Enter.</div></div>
      <div id="preview" class="hidden flex-1 min-h-0 bg-white"><iframe id="previewFrame" class="w-full h-full border-0" sandbox="allow-scripts" title="Preview"></iframe></div>
      <div class="p-3 border-t border-slate-800"><label for="stdin" class="block text-xs text-slate-400 mb-1">Standard Input</label><input id="stdin" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" placeholder="Optional input..."></div>
    </section>
  </main>
</div>

<!-- AI Drawer -->
<div id="aiDrawer" class="hidden fixed inset-0 z-40">
  <div id="aiCloseBackdrop" class="absolute inset-0 bg-slate-950/70"></div>
  <aside class="absolute right-0 top-0 bottom-0 w-full sm:w-[430px] bg-slate-900 border-l border-slate-700 shadow-2xl flex flex-col">
    <div class="h-14 shrink-0 px-4 border-b border-slate-700 flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-violet-600 flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles"></i></div><strong>codeyau AI</strong></div><button id="aiClose" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="aiMessages" class="flex-1 overflow-auto panel-scroll p-4 space-y-3"></div>
    <div class="p-3 border-t border-slate-700 space-y-2"><div class="flex gap-1 flex-wrap"><button class="aiQuick px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700" data-prompt="Explain this code clearly.">Explain</button><button class="aiQuick px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700" data-prompt="Find bugs and explain how to fix them.">Find bugs</button><button class="aiQuick px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700" data-prompt="Improve this code for readability and performance.">Improve</button><button class="aiQuick px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700" data-prompt="Write tests for this code.">Tests</button></div><textarea id="aiInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm resize-none focus:outline-none focus:border-violet-500" placeholder="Ask the coding assistant..."></textarea><button id="aiSend" class="w-full py-2.5 rounded-lg bg-violet-600 hover:bg-violet-500 font-semibold"><i class="fa-solid fa-paper-plane mr-1"></i>Ask AI</button></div>
  </aside>
</div>

<!-- Account Modal -->
<div id="accountModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden"><div class="p-5 border-b border-slate-700 flex justify-between"><div><h2 id="authTitle" class="text-xl font-bold">Sign in</h2><p class="text-xs text-slate-400 mt-1">Your account is stored securely in this browser.</p></div><button id="authClose" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div><div class="p-5 space-y-3"><input id="authName" class="hidden w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm" placeholder="Display name"><input id="authEmail" type="email" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm" placeholder="Email"><input id="authPassword" type="password" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm" placeholder="Password"><button id="authSubmit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold">Sign in</button><button id="authSwitch" class="w-full text-xs text-indigo-300 hover:text-indigo-200">Create a new account</button><div id="authError" class="hidden text-xs text-red-400"></div></div></div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4"><div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden"><div class="p-5 border-b border-slate-700 flex justify-between"><div><h2 class="text-xl font-bold">Settings</h2><p class="text-xs text-slate-400 mt-1">Configure your local workspace and AI.</p></div><button id="settingsClose" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div><div class="p-5 space-y-4"><div><label class="block text-xs font-medium text-slate-400 mb-1">Gemini API key</label><input id="geminiKey" type="password" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm" placeholder="Paste your Gemini API key"><p class="text-[11px] text-slate-500 mt-1">Stored only in this browser. It is not committed to GitHub.</p></div><div><label class="block text-xs font-medium text-slate-400 mb-1">AI model</label><input id="geminiModel" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm" value="gemini-2.0-flash"></div><div class="flex justify-end gap-2"><button id="settingsCancel" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">Cancel</button><button id="settingsSave" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500">Save</button></div></div></div></div>

<div id="toast" class="fixed bottom-5 right-5 z-[60] translate-y-20 opacity-0 transition-all bg-slate-800 border border-slate-700 shadow-2xl rounded-xl px-4 py-3 text-sm"><span id="toastText"></span></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const templates = {
  python:'a = 384 + 347\nprint(a)\n\ndef greet(name):\n    return f"Hello, {name}!"\n\nprint(greet("Developer"))',
  javascript:'const numbers = [10, 20, 30, 40];\nconst total = numbers.reduce((sum, value) => sum + value, 0);\nconsole.log("Numbers:", numbers);\nconsole.log("Total:", total);',
  cpp:'#include <iostream>\nusing namespace std;\nint main() {\n    cout << 384 + 347 << endl;\n    return 0;\n}',
  java:'public class Main {\n    public static void main(String[] args) {\n        System.out.println(384 + 347);\n    }\n}',
  html:'<!doctype html>\n<html><head><meta charset="utf-8"><style>body{font-family:system-ui;padding:2rem}h1{color:#4f46e5}</style></head><body><h1>Hello, codeyau!</h1><p>Edit me and press Run.</p></body></html>'
};
const modes={python:'python',javascript:'javascript',cpp:'text/x-c++src',java:'text/x-java',html:'htmlmixed'};
const extensions={python:'py',javascript:'js',cpp:'cpp',java:'java',html:'html'};
let files=[{name:'main.py',language:'python',content:templates.python}], current=0, editor=null, pyodide=null, pyodidePromise=null, authMode='signin', currentUser=null, light=false;
const getTheme=()=>localStorage.getItem('codeyau-theme')||'dark';
function toast(msg,type='ok'){ $('toastText').textContent=msg; $('toast').className=`fixed bottom-5 right-5 z-[60] transition-all bg-slate-800 border border-slate-700 shadow-2xl rounded-xl px-4 py-3 text-sm ${type==='error'?'text-red-300':'text-slate-100'}`; clearTimeout(window.__toast); window.__toast=setTimeout(()=>{$('toast').classList.add('translate-y-20','opacity-0')},2500); }
function persist(){ try{ files[current].content=editor?editor.getValue():files[current].content; localStorage.setItem('codeyau-files',JSON.stringify(files)); localStorage.setItem('codeyau-current',String(current)); }catch{} }
function loadWorkspace(){ try{const raw=localStorage.getItem('codeyau-files'); const parsed=raw?JSON.parse(raw):null; if(Array.isArray(parsed)&&parsed.length)files=parsed.filter(f=>f&&f.name&&typeof f.content==='string').map(f=>({name:f.name,language:modes[f.language]?f.language:detectLanguage(f.name),content:f.content})); const saved=Number(localStorage.getItem('codeyau-current')); if(Number.isInteger(saved)&&saved>=0&&saved<files.length)current=saved;}catch{} }
function detectLanguage(name){const ext=name.split('.').pop().toLowerCase(); if(ext==='js'||ext==='mjs')return'javascript';if(['cpp','cc','cxx','c'].includes(ext))return'cpp';if(ext==='java')return'java';if(['html','htm'].includes(ext))return'html';return'python';}
function applyTheme(){light=getTheme()==='light';$('app').classList.toggle('light',light);$('app').classList.toggle('bg-slate-950',!light);$('app').classList.toggle('bg-slate-50',light);$('themeIcon').className=light?'fa-solid fa-moon':'fa-solid fa-sun';if(editor)editor.setOption('theme',light?'eclipse':'dracula');}
function updateStatus(){if(!editor)return;const f=files[current],c=editor.getCursor(),text=editor.getValue();$('statusFile').textContent=f.name;$('statusLanguage').textContent={python:'Python 3',javascript:'JavaScript',cpp:'C++',java:'Java',html:'HTML / CSS / JS'}[f.language];$('statusPosition').textContent=`Ln ${c.line+1}, Col ${c.ch+1}`;const lines=text.split('\n').length,words=text.trim()?text.trim().split(/\s+/).length:0;$('statusStats').textContent=`${lines} lines · ${words} words`;}
function renderFiles(){const list=$('fileList'),tabs=$('tabs');list.innerHTML='';tabs.innerHTML='';files.forEach((f,i)=>{const b=document.createElement('button');b.className=`w-full text-left px-3 py-2 rounded-lg text-sm ${i===current?'bg-indigo-600/20 text-indigo-300 border border-indigo-500/20':'text-slate-400 hover:bg-slate-800'}`;b.textContent=f.name;b.onclick=()=>switchFile(i);list.appendChild(b);const t=document.createElement('button');t.className=`px-4 h-full text-sm rounded-t-lg border-t-2 ${i===current?'bg-slate-950 text-slate-100 border-indigo-500':'text-slate-400 border-transparent hover:text-slate-200'}`;t.textContent=f.name;t.onclick=()=>switchFile(i);tabs.appendChild(t);});updateStatus();}
function switchFile(i){if(i===current)return;persist();current=i;editor.setOption('mode',modes[files[i].language]);editor.setValue(files[i].content);editor.clearHistory();$('language').value=files[i].language;renderFiles();updatePreviewState();}
function addFile(){const name=(prompt('File name:',`file${files.length+1}.py`)||'').trim();if(!name)return;if(!/^[A-Za-z0-9._-]+$/.test(name))return toast('Invalid file name','error');if(files.some(f=>f.name.toLowerCase()===name.toLowerCase()))return toast('A file with that name already exists.','error');const language=detectLanguage(name);files.push({name,language,content:templates[language]||''});current=files.length-1;editor.setOption('mode',modes[language]);editor.setValue(files[current].content);$('language').value=language;renderFiles();persist();}
function deleteFile(i){if(files.length===1)return toast('You need at least one file.','error');if(!confirm(`Delete ${files[i].name}?`))return;files.splice(i,1);current=Math.min(current,files.length-1);editor.setOption('mode',modes[files[current].language]);editor.setValue(files[current].content);$('language').value=files[current].language;renderFiles();persist();}
function clearConsole(){ $('console').innerHTML='<div class="text-slate-500 italic">Console cleared.</div>'; }
function log(text,type='info'){const el=document.createElement('pre');el.className=`m-0 whitespace-pre-wrap ${type==='error'?'text-red-400':type==='success'?'text-emerald-400':'text-slate-300'}`;el.textContent=String(text);$('console').appendChild(el);$('console').scrollTop=$('console').scrollHeight;}
async function getPyodide(){if(pyodide)return pyodide;if(pyodidePromise)return pyodidePromise;if(typeof loadPyodide!=='function')throw new Error('Python runtime failed to load. Check your connection.');pyodidePromise=loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'}).then(x=>{pyodide=x;return x}).catch(e=>{pyodidePromise=null;throw e});return pyodidePromise;}
async function runPython(code){const py=await getPyodide();py.setStdout({batched:s=>log(s)});py.setStderr({batched:s=>log(s,'error')});py.setStdin({stdin:()=>String($('stdin').value||'')});await py.runPythonAsync(code);log('✓ Python execution completed.','success');}
function runJavaScript(code){return new Promise(resolve=>{const frame=document.createElement('iframe');frame.hidden=true;document.body.appendChild(frame);const token=`${Date.now()}-${Math.random()}`;const finish=()=>{window.removeEventListener('message',onMessage);frame.remove();resolve()};const onMessage=e=>{if(e.source!==frame.contentWindow||e.data?.token!==token)return;if(e.data.type==='log')log(e.data.value);if(e.data.type==='error')log(e.data.value,'error');if(e.data.type==='done')finish()};window.addEventListener('message',onMessage);const safe=code.replace(/<\\/script/gi,'<\\/script>');frame.srcdoc=`<!doctype html><script>(function(){const t=${JSON.stringify(token)};const send=(type,value)=>parent.postMessage({token:t,type,value},'*');const fmt=v=>{try{return typeof v==='string'?v:JSON.stringify(v,null,2)}catch{return String(v)}};console.log=(...a)=>send('log',a.map(fmt).join(' '));console.warn=(...a)=>send('log','[warn] '+a.map(fmt).join(' '));console.error=(...a)=>send('error',a.map(fmt).join(' '));window.onerror=(m)=>send('error',String(m));try{${safe}}catch(e){send('error',e.stack||e.message||String(e))}finally{send('done','')}})()<\/script>`;});}
async function runRemote(language,code){const languageId=language==='cpp'?54:62;const body={language_id:languageId,source_code:btoa(unescape(encodeURIComponent(code))),stdin:btoa(unescape(encodeURIComponent($('stdin').value||'')))};const response=await fetch('https://ce.judge0.com/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw new Error(`Compiler service returned HTTP ${response.status}.`);const result=await response.json();if(result.stdout)log(decode64(result.stdout));if(result.stderr)log(decode64(result.stderr),'error');if(result.compile_output)log(decode64(result.compile_output),'error');if(result.message)log(result.message,'error');if(result.status?.description&&result.status.description!=='Accepted')log(`Status: ${result.status.description}`,'error');if(!result.stdout&&!result.stderr&&!result.compile_output&&!result.message)log('No program output.');if(result.status?.id===3)log('✓ Program completed.','success');}
function decode64(s){try{return decodeURIComponent(escape(atob(s)))}catch{return atob(s)}}
function runHtml(code){$('console').classList.add('hidden');$('preview').classList.remove('hidden');$('previewTab').classList.remove('hidden');$('consoleTab').classList.add('hidden');$('previewFrame').srcdoc=code;}
function updatePreviewState(){if(files[current].language!=='html'){$('preview').classList.add('hidden');$('console').classList.remove('hidden');$('previewTab').classList.add('hidden');$('consoleTab').classList.remove('hidden');}}
async function runCode(){persist();clearConsole();$('preview').classList.add('hidden');$('console').classList.remove('hidden');$('previewTab').classList.toggle('hidden',files[current].language!=='html');$('consoleTab').classList.remove('hidden');$('runBtn').disabled=true;const f=files[current];log(`▶ Running ${f.name}...`);try{if(f.language==='python')await runPython(f.content);else if(f.language==='javascript')await runJavaScript(f.content);else if(f.language==='html')runHtml(f.content);else await runRemote(f.language,f.content);}catch(e){log(e?.stack||e?.message||String(e),'error')}finally{$('runBtn').disabled=false;persist();}}
function exportCurrent(){persist();const f=files[current];downloadBlob(f.name,f.content,'text/plain');toast('File exported.');}
function exportProject(){persist();downloadBlob('codeyau-project.json',JSON.stringify({version:2,name:'codeyau-project',files},null,2),'application/json');toast('Project exported.');}
function downloadBlob(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importProject(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.files)||!data.files.length)throw new Error('Invalid project file.');files=data.files.map(f=>({name:String(f.name||'file.txt'),language:modes[f.language]?f.language:detectLanguage(String(f.name||'')),content:String(f.content||'')}));current=0;editor.setOption('mode',modes[files[0].language]);editor.setValue(files[0].content);$('language').value=files[0].language;renderFiles();persist();toast('Project imported.');}catch(e){toast(e.message,'error')}};reader.readAsText(file);}
function createShareLink(){persist();const payload=btoa(unescape(encodeURIComponent(JSON.stringify(files[current])))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const url=`${location.origin}${location.pathname}#share=${payload}`;history.replaceState(null,'',`#share=${payload}`);if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Share link copied.')).catch(()=>prompt('Copy link:',url));else prompt('Copy link:',url);}
function loadShare(){if(!location.hash.startsWith('#share='))return;try{const raw=location.hash.slice(7).replace(/-/g,'+').replace(/_/g,'/');const padded=raw+'='.repeat((4-raw.length%4)%4);const shared=JSON.parse(decodeURIComponent(escape(atob(padded))));if(!shared.content)return;files=[{name:shared.name||'shared.txt',language:modes[shared.language]?shared.language:detectLanguage(shared.name||''),content:shared.content}];current=0;editor.setOption('mode',modes[files[0].language]);editor.setValue(files[0].content);$('language').value=files[0].language;renderFiles();toast('Shared code loaded.');}catch{toast('Invalid share link.','error')}}

async function deriveHash(password,salt){const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function getUsers(){try{return JSON.parse(localStorage.getItem('codeyau-users')||'{}')}catch{return {}}}
async function register(){const name=$('authName').value.trim(),email=$('authEmail').value.trim().toLowerCase(),pass=$('authPassword').value;if(!name||!email||pass.length<8)throw new Error('Enter a name, valid email and password of at least 8 characters.');const users=getUsers();if(users[email])throw new Error('An account with this email already exists.');users[email]={name,email,salt:crypto.randomUUID(),hash:await deriveHash(pass,email)};localStorage.setItem('codeyau-users',JSON.stringify(users));currentUser={name,email};localStorage.setItem('codeyau-session',JSON.stringify(currentUser));closeAccount();updateAccount();toast('Account created.');}
async function signIn(){const email=$('authEmail').value.trim().toLowerCase(),pass=$('authPassword').value;if(!email||!pass)throw new Error('Enter your email and password.');const users=getUsers(),user=users[email];if(!user)throw new Error('Account not found.');const hash=await deriveHash(pass,email);if(hash!==user.hash)throw new Error('Incorrect password.');currentUser={name:user.name,email};localStorage.setItem('codeyau-session',JSON.stringify(currentUser));closeAccount();updateAccount();toast('Signed in successfully.');}
function loadSession(){try{currentUser=JSON.parse(localStorage.getItem('codeyau-session')||'null')}catch{currentUser=null}updateAccount();}
function updateAccount(){const logged=!!currentUser;$('accountText').textContent=logged?(currentUser.name||'Account'):'Sign in';}
function openAccount(){if(currentUser){if(confirm(`Signed in as ${currentUser.email}. Sign out?`)){currentUser=null;localStorage.removeItem('codeyau-session');updateAccount();toast('Signed out.')}}else{$('accountModal').classList.remove('hidden');$('accountModal').classList.add('flex');setAuthMode('signin')}}
function closeAccount(){$('accountModal').classList.add('hidden');$('accountModal').classList.remove('flex');}
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';$('authTitle').textContent=signup?'Create account':'Sign in';$('authName').classList.toggle('hidden',!signup);$('authSubmit').textContent=signup?'Create account':'Sign in';$('authSwitch').textContent=signup?'Already have an account? Sign in':'Create a new account';$('authError').classList.add('hidden');}
async function submitAuth(){try{$('authSubmit').disabled=true; if(authMode==='signup')await register();else await signIn();}catch(e){$('authError').textContent=e.message;$('authError').classList.remove('hidden')}finally{$('authSubmit').disabled=false}}
function openSettings(){$('geminiKey').value=localStorage.getItem('codeyau-gemini-key')||'';$('geminiModel').value=localStorage.getItem('codeyau-gemini-model')||'gemini-2.0-flash';$('settingsModal').classList.remove('hidden');$('settingsModal').classList.add('flex');}
function closeSettings(){$('settingsModal').classList.add('hidden');$('settingsModal').classList.remove('flex');}
function saveSettings(){const key=$('geminiKey').value.trim(),model=$('geminiModel').value.trim()||'gemini-2.0-flash';if(key)localStorage.setItem('codeyau-gemini-key',key);else localStorage.removeItem('codeyau-gemini-key');localStorage.setItem('codeyau-gemini-model',model);closeSettings();toast('Settings saved.');}
function addAiMessage(text,role){const box=document.createElement('div');box.className=`rounded-xl p-3 text-sm ${role==='user'?'bg-indigo-600/20 text-indigo-100':'bg-slate-800 text-slate-200'}`;box.innerHTML=`<div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">${role==='user'?'You':'codeyau AI'}</div><div class="ai-message">${escapeHtml(text)}</div>`;$('aiMessages').appendChild(box);$('aiMessages').scrollTop=$('aiMessages').scrollHeight;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function askAI(prompt){const key=localStorage.getItem('codeyau-gemini-key');if(!key){addAiMessage('Add your Gemini API key in Settings first.','assistant');openSettings();return;}persist();const code=files[current].content;addAiMessage(prompt,'user');$('aiSend').disabled=true;$('aiSend').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Thinking...';try{const model=localStorage.getItem('codeyau-gemini-model')||'gemini-2.0-flash';const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;const body={contents:[{role:'user',parts:[{text:`You are the built-in coding assistant for codeyau. Be precise and practical.\nLanguage: ${files[current].language}\nFile: ${files[current].name}\nCode:\n---\n${code}\n---\nUser request: ${prompt}` }]}],generationConfig:{temperature:0.2,maxOutputTokens:1800}};const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||`AI request failed (${r.status})`);const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'No response.';addAiMessage(text,'assistant');}catch(e){addAiMessage(`AI error: ${e.message}`,'assistant')}finally{$('aiSend').disabled=false;$('aiSend').innerHTML='<i class="fa-solid fa-paper-plane mr-1"></i>Ask AI';}}
function openAI(){if(!$('aiMessages').children.length)addAiMessage('I can explain, debug, improve, and test the code in your current file.','assistant');$('aiDrawer').classList.remove('hidden');}
function closeAI(){$('aiDrawer').classList.add('hidden');}

$('menuBtn').onclick=()=>$('sidebar').classList.toggle('sidebar-collapsed');
$('newFileBtn').onclick=addFile;$('resetBtn').onclick=()=>{if(confirm('Reset the entire local workspace?')){localStorage.removeItem('codeyau-files');localStorage.removeItem('codeyau-current');location.reload()}};$('importBtn').onclick=()=>$('importInput').click();$('importInput').onchange=e=>{if(e.target.files[0])importProject(e.target.files[0]);e.target.value=''};$('exportProjectBtn').onclick=exportProject;
$('saveBtn').onclick=()=>{persist();toast('Project saved locally.');};$('exportBtn').onclick=exportCurrent;$('shareBtn').onclick=createShareLink;$('runBtn').onclick=runCode;$('clearBtn').onclick=clearConsole;$('consoleTab').onclick=()=>{$('console').classList.remove('hidden');$('preview').classList.add('hidden');};$('previewTab').onclick=()=>{$('preview').classList.remove('hidden');$('console').classList.add('hidden');};
$('language').onchange=()=>{persist();const lang=$('language').value,f=files[current],base=f.name.includes('.')?f.name.slice(0,f.name.lastIndexOf('.')):f.name;f.language=lang;f.name=`${base}.${extensions[lang]}`;if(confirm('Load the starter template for this language?'))f.content=templates[lang];editor.setOption('mode',modes[lang]);editor.setValue(f.content);renderFiles();updatePreviewState();persist();};
$('themeBtn').onclick=()=>{localStorage.setItem('codeyau-theme',getTheme()==='light'?'dark':'light');applyTheme();};$('settingsBtn').onclick=openSettings;$('settingsClose').onclick=closeSettings;$('settingsCancel').onclick=closeSettings;$('settingsSave').onclick=saveSettings;
$('accountBtn').onclick=openAccount;$('authClose').onclick=closeAccount;$('authSwitch').onclick=()=>setAuthMode(authMode==='signin'?'signup':'signin');$('authSubmit').onclick=submitAuth;
$('aiBtn').onclick=openAI;$('aiClose').onclick=closeAI;$('aiCloseBackdrop').onclick=closeAI;$('aiSend').onclick=()=>{const p=$('aiInput').value.trim();if(p){$('aiInput').value='';askAI(p)}};$('aiInput').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('aiSend').click()}});document.querySelectorAll('.aiQuick').forEach(b=>b.onclick=()=>askAI(b.dataset.prompt));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persist();toast('Project saved locally.');}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCode();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();openAI();}});
window.addEventListener('beforeunload',persist);
loadWorkspace();applyTheme();loadSession();
window.addEventListener('DOMContentLoaded',()=>{editor=CodeMirror.fromTextArea($('editor'),{mode:modes[files[current].language],theme:getTheme()==='light'?'eclipse':'dracula',lineNumbers:true,autoCloseBrackets:true,matchBrackets:true,styleActiveLine:true,indentUnit:4,tabSize:4,indentWithTabs:false,viewportMargin:30});editor.setValue(files[current].content);editor.on('change',()=>{files[current].content=editor.getValue();updateStatus();clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(persist,450)});editor.on('cursorActivity',updateStatus);$('language').value=files[current].language;renderFiles();updatePreviewState();loadShare();});
})();
</script>
</body>
</html>
