<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="codeyau - browser based online IDE">
<title>codeyau — Online IDE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<!-- Load Python before the IDE starts. This removes the race condition that caused Python runs to fail. -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
html,body{margin:0;min-height:100%}.CodeMirror{height:100%!important;font-family:monospace!important;font-size:14px;line-height:1.6}.CodeMirror-gutters{background:#0f172a!important;border-right:1px solid #1e293b!important}.CodeMirror-linenumber{color:#64748b!important}.CodeMirror-activeline-background{background:rgba(99,102,241,.08)!important}.sidebar-collapsed{width:0!important;overflow:hidden}#preview-frame{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body id="body" class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden">
<header class="bg-slate-800 border-b border-slate-700 flex items-center justify-between gap-3 px-3 sm:px-4 py-2 shrink-0 z-20">
<div class="flex items-center gap-2 min-w-0"><button id="menu" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-bars"></i></button><div class="bg-indigo-600 text-white p-2 rounded-xl"><i class="fa-solid fa-code"></i></div><div class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">codeyau</div><span class="hidden sm:inline text-[11px] bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-full">Browser IDE</span></div>
<div class="flex items-center gap-1.5"><select id="lang" class="bg-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 border border-slate-600"><option value="python">Python 3</option><option value="javascript">JavaScript</option><option value="cpp">C++</option><option value="java">Java</option><option value="html">HTML / CSS / JS</option></select><button id="save" class="hidden md:block px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-floppy-disk"></i> Save</button><button id="export" class="hidden md:block px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-download"></i> Export</button><button id="share" class="hidden lg:block px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-share-nodes"></i> Share</button><button id="theme" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-sun"></i></button><button id="run" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg"><i class="fa-solid fa-play"></i> Run</button></div>
</header>
<div class="flex-1 flex overflow-hidden">
<aside id="sidebar" class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 transition-all"><div class="p-3 border-b border-slate-700 flex justify-between"><span class="text-xs font-semibold uppercase text-slate-400">Project Files</span><button id="newfile"><i class="fa-solid fa-plus"></i></button></div><div id="files" class="flex-1 p-2 overflow-auto"></div><div class="p-2 border-t border-slate-700"><button id="reset" class="w-full py-2 bg-slate-700 rounded-lg text-xs">Reset Workspace</button></div></aside>
<main class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-950 min-w-0">
<section class="flex-1 min-w-0 flex flex-col border-r border-slate-800"><div id="tabs" class="h-10 bg-slate-900 border-b border-slate-800 flex items-center px-2"></div><div class="flex-1 min-h-0"><textarea id="editor"></textarea></div><div class="h-6 bg-slate-900 border-t border-slate-800 px-3 flex justify-between text-[10px] text-slate-500"><span id="status-file">main.py</span><span id="status">Ln 1, Col 1</span></div></section>
<section class="w-full lg:w-[26rem] bg-slate-900 flex flex-col shrink-0 min-h-0"><div class="bg-slate-800 px-4 py-2.5 border-b border-slate-700 flex justify-between"><span class="text-xs font-semibold uppercase"><i class="fa-solid fa-terminal text-indigo-400"></i> Output / Preview</span><button id="clear" class="text-xs bg-slate-700 px-2 py-1 rounded">Clear</button></div><div id="console" class="flex-1 min-h-0 p-4 font-mono text-xs overflow-auto bg-slate-950"></div><div id="preview" class="hidden flex-1 min-h-0 bg-white"><iframe id="preview-frame" sandbox="allow-scripts"></iframe></div><div class="p-3 border-t border-slate-800"><label class="block text-xs text-slate-400 mb-1">Standard Input</label><input id="stdin" class="w-full bg-slate-950 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700" placeholder="Optional input..."></div></section>
</main></div>
<div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-700 px-4 py-3 rounded-xl shadow-xl translate-y-20 opacity-0 transition-all"><span id="toastText"></span></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const templates={python:'a = 384 + 347\nprint(a)',javascript:'const a = 384 + 347;\nconsole.log(a);',cpp:'#include <iostream>\nint main(){std::cout << 384+347;}',java:'class Main { public static void main(String[] args){ System.out.println(384+347); } }',html:'<!doctype html><html><body><h1>Hello, codeyau!</h1></body></html>'};
const modes={python:'python',javascript:'javascript',cpp:'text/x-c++src',java:'text/x-java',html:'htmlmixed'};
const ext={python:'py',javascript:'js',cpp:'cpp',java:'java',html:'html'};
let files=[{name:'main.py',language:'python',content:templates.python}],current=0,editor=null,py=null,pyPromise=null;
function toast(t){$('toastText').textContent=t;$('toast').classList.remove('translate-y-20','opacity-0');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.add('translate-y-20','opacity-0'),2200)}
function saveLocal(){try{files[current].content=editor.getValue();localStorage.setItem('codeyau-files',JSON.stringify(files));localStorage.setItem('codeyau-current',current)}catch{}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('codeyau-files'));if(Array.isArray(x)&&x.length)files=x;current=Math.max(0,Math.min(Number(localStorage.getItem('codeyau-current')||0),files.length-1))}catch{}}
function detect(n){const e=n.split('.').pop().toLowerCase();return e==='js'?'javascript':e==='cpp'||e==='cc'||e==='cxx'?'cpp':e==='java'?'java':e==='html'?'html':'python'}
function render(){const fl=$('files'),tabs=$('tabs');fl.innerHTML='';tabs.innerHTML='';files.forEach((f,i)=>{const b=document.createElement('button');b.className='w-full text-left px-3 py-2 rounded-lg text-sm '+(i===current?'bg-indigo-600/20 text-indigo-300':'text-slate-400 hover:bg-slate-700');b.textContent=f.name;b.onclick=()=>switchFile(i);fl.appendChild(b);const t=document.createElement('button');t.className='px-4 h-full text-sm '+(i===current?'bg-slate-950 text-white border-t-2 border-indigo-500':'text-slate-400');t.textContent=f.name;t.onclick=()=>switchFile(i);tabs.appendChild(t)});$('status-file').textContent=files[current].name}
function switchFile(i){if(i===current)return;files[current].content=editor.getValue();current=i;editor.setOption('mode',modes[files[i].language]);editor.setValue(files[i].content);render();saveLocal()}
function addFile(){const n=prompt('File name:',`file${files.length+1}.py`);if(!n)return;if(files.some(f=>f.name===n))return toast('File already exists');const language=detect(n);files.push({name:n,language,content:templates[language]||''});current=files.length-1;editor.setOption('mode',modes[language]);editor.setValue(files[current].content);render();saveLocal()}
function log(text,type='normal'){const p=document.createElement('pre');p.className='whitespace-pre-wrap m-0 '+(type==='error'?'text-red-400':type==='ok'?'text-emerald-400':'text-slate-300');p.textContent=String(text);$('console').appendChild(p);$('console').scrollTop=$('console').scrollHeight}
async function getPython(){if(py)return py;if(pyPromise)return pyPromise;if(typeof loadPyodide!=='function')throw new Error('Python runtime script did not load.');pyPromise=loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'}).then(x=>{py=x;return x}).catch(e=>{pyPromise=null;throw new Error('Could not load Python runtime: '+e.message)});return pyPromise}
async function runPython(code){const runtime=await getPython();runtime.setStdout({batched:s=>log(s)});runtime.setStderr({batched:s=>log(s,'error')});runtime.setStdin({stdin:()=>String($('stdin').value||'')});await runtime.runPythonAsync(code);log('✓ Python execution completed.','ok')}
function runJS(code){return new Promise(resolve=>{const frame=document.createElement('iframe');frame.hidden=true;document.body.appendChild(frame);const token=Date.now()+Math.random();const onmsg=e=>{if(e.source!==frame.contentWindow||e.data?.token!==token)return;if(e.data.type==='log')log(e.data.value);if(e.data.type==='error')log(e.data.value,'error');if(e.data.type==='done'){remove();resolve()}};const remove=()=>{window.removeEventListener('message',onmsg);frame.remove()};window.addEventListener('message',onmsg);const safe=code.replace(/<\\\/script/gi,'<\\\\/script');frame.srcdoc=`<script>(function(){const t=${JSON.stringify(token)};const send=(type,value)=>parent.postMessage({token:t,type,value},'*');console.log=(...a)=>send('log',a.join(' '));console.error=(...a)=>send('error',a.join(' '));try{${safe}}catch(e){send('error',e.stack||e.message)}finally{send('done','')}})()<\\/script>`})}
function runHTML(code){$('console').classList.add('hidden');$('preview').classList.remove('hidden');$('preview-frame').srcdoc=code}
async function run(){files[current].content=editor.getValue();const f=files[current];$('console').innerHTML='';$('preview').classList.add('hidden');$('console').classList.remove('hidden');log('▶ Running '+f.name+'...');$('run').disabled=true;try{if(f.language==='python')await runPython(f.content);else if(f.language==='javascript')await runJS(f.content);else if(f.language==='html')runHTML(f.content);else log((f.language==='cpp'?'C++':'Java')+' requires a server-side compiler. GitHub Pages cannot compile it.','error')}catch(e){log(e.stack||e.message||String(e),'error')}finally{$('run').disabled=false;saveLocal()}}
function download(){files[current].content=editor.getValue();const f=files[current],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.content],{type:'text/plain'}));a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function share(){files[current].content=editor.getValue();const data=btoa(unescape(encodeURIComponent(JSON.stringify(files[current])))).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');const u=location.href.split('#')[0]+'#share='+data;navigator.clipboard?.writeText(u).then(()=>toast('Share link copied')).catch(()=>prompt('Copy link',u))}
function loadShare(){if(!location.hash.startsWith('#share='))return;try{const s=location.hash.slice(7).replace(/-/g,'+').replace(/_/g,'/');const x=JSON.parse(decodeURIComponent(escape(atob(s+'='.repeat((4-s.length%4)%4)))));if(x.content){files=[x];current=0;editor.setValue(x.content);editor.setOption('mode',modes[x.language]||'python');render();toast('Shared code loaded')}}catch{toast('Invalid share link')}}
$('run').onclick=run;$('save').onclick=()=>{saveLocal();toast('Project saved')};$('export').onclick=download;$('share').onclick=share;$('newfile').onclick=addFile;$('clear').onclick=()=>$('console').innerHTML='<div class="text-slate-500 italic">Console cleared.</div>';$('menu').onclick=()=>$('sidebar').classList.toggle('sidebar-collapsed');$('lang').onchange=()=>{const l=$('lang').value;files[current].language=l;files[current].name='main.'+ext[l];editor.setOption('mode',modes[l]);editor.setValue(templates[l]||'');render();saveLocal()};$('reset').onclick=()=>{if(confirm('Reset workspace?')){localStorage.removeItem('codeyau-files');localStorage.removeItem('codeyau-current');location.reload()}};$('theme').onclick=()=>{$('body').classList.toggle('bg-slate-900');editor.setOption('theme',editor.getOption('theme')==='dracula'?'eclipse':'dracula')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveLocal();toast('Project saved')}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
window.addEventListener('beforeunload',saveLocal);
loadLocal();
window.addEventListener('DOMContentLoaded',()=>{editor=CodeMirror.fromTextArea($('editor'),{mode:modes[files[current].language],theme:'dracula',lineNumbers:true,autoCloseBrackets:true,matchBrackets:true,styleActiveLine:true,indentUnit:4,tabSize:4});editor.setValue(files[current].content);editor.on('cursorActivity',()=>{const c=editor.getCursor();$('status').textContent=`Ln ${c.line+1}, Col ${c.ch+1}`});editor.on('change',saveLocal);$('lang').value=files[current].language;render();$('console').innerHTML='<div class="text-slate-500 italic">Ready. Run with Ctrl+Enter.</div>';loadShare()});
})();
</script>
</body>
</html>
