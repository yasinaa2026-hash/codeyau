<body id="app" class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">
<header class="h-16 shrink-0 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 sm:px-4 gap-3 z-30"><div class="flex items-center gap-2 min-w-0"><button id="menuBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700" aria-label="Toggle project sidebar"><i class="fa-solid fa-bars"></i></button><a href="./" class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center" title="CodeYau Home"><i class="fa-solid fa-code"></i></a><div class="font-bold text-xl bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">CodeYau IDE</div></div><div class="flex items-center gap-1.5 shrink-0"><select id="language" aria-label="Programming language" class="max-w-[150px] bg-slate-800 text-slate-200 text-sm rounded-lg px-2.5 py-2 border border-slate-700"><option value="python">Python 3</option><option value="javascript">JavaScript</option><option value="cpp">C++</option><option value="java">Java</option><option value="html">HTML / CSS / JS</option></select><a href="./projects.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-folder-open"></i><span class="hidden sm:inline ml-1">Projects</span></a><button id="aiBtn" class="px-3 py-2 bg-violet-600 hover:bg-violet-500 rounded-lg"><i class="fa-solid fa-wand-magic-sparkles"></i> AI</button><button id="settingsBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg" aria-label="Settings"><i class="fa-solid fa-gear"></i></button><button id="themeBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg" aria-label="Toggle theme"><i id="themeIcon" class="fa-solid fa-sun"></i></button><button id="saveBtn" class="hidden md:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg">Save</button><button id="exportBtn" class="hidden md:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg">Export</button><button id="shareBtn" class="hidden lg:block px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg">Share</button><button id="runBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-900 rounded-lg font-semibold"><i class="fa-solid fa-play"></i> Run</button></div></header>
<div class="flex-1 flex overflow-hidden min-h-0"><aside id="sidebar" class="w-64 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col"><div class="p-3 border-b border-slate-800 flex justify-between"><span class="text-xs font-semibold uppercase text-slate-400">Project Files</span><button id="newFileBtn" aria-label="New file"><i class="fa-solid fa-plus"></i></button></div><div id="fileList" class="flex-1 overflow-auto p-2 space-y-1"></div><div class="p-2 border-t border-slate-800 grid grid-cols-3 gap-1"><button id="importBtn" class="py-2 bg-slate-800 rounded">Import</button><a href="./projects.html" class="py-2 bg-slate-800 rounded text-center" title="Open Projects"><i class="fa-solid fa-folder-open"></i></a><button id="resetBtn" class="py-2 bg-slate-800 rounded">Reset</button></div><input id="importInput" type="file" accept="application/json,.json" hidden></aside>
<main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-w-0"><section class="flex-1 min-w-0 flex flex-col border-r border-slate-800"><div id="tabs" class="h-10 shrink-0 bg-slate-900 border-b border-slate-800 flex items-center overflow-x-auto px-2"></div><div class="flex-1 min-h-0"><textarea id="editor" aria-label="Code editor"></textarea></div><div class="h-6 shrink-0 bg-slate-900 border-t border-slate-800 px-3 flex justify-between text-[10px] text-slate-500"><div><span id="statusFile">main.py</span> · <span id="statusLanguage">Python 3</span></div><div><span id="statusPosition">Ln 1, Col 1</span> · <span id="statusStats">1 line</span></div></div></section><section class="w-full lg:w-[28rem] shrink-0 bg-slate-900 flex flex-col min-h-0"><div class="h-12 bg-slate-800 border-b border-slate-700 px-4 flex items-center justify-between"><span class="text-xs font-semibold uppercase">Output / Preview</span><div><button id="consoleTab" class="px-2 py-1 text-xs rounded bg-slate-700">Console</button><button id="previewTab" class="hidden px-2 py-1 text-xs rounded bg-slate-700">Preview</button><button id="clearBtn" class="px-2 py-1 text-xs rounded bg-slate-700">Clear</button></div></div><div id="console" class="flex-1 min-h-0 overflow-auto p-4 font-mono text-xs bg-slate-950"><div class="text-slate-500 italic">Ready. Run with Ctrl+Enter.</div></div><div id="preview" class="hidden flex-1 min-h-0 bg-white"><iframe id="previewFrame" class="w-full h-full border-0" sandbox="allow-scripts" title="Code preview"></iframe></div><div class="p-3 border-t border-slate-800"><label class="block text-xs text-slate-400 mb-1" for="stdin">Standard Input</label><input id="stdin" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs" placeholder="Optional input..." aria-label="Standard input"></div></section></main></div>
<div id="aiDrawer" class="hidden fixed inset-0 z-40"><div id="aiCloseBackdrop" class="absolute inset-0 bg-slate-950/70"></div><aside class="absolute right-0 top-0 bottom-0 w-full sm:w-[430px] bg-slate-900 border-l border-slate-700 flex flex-col"><div class="h-14 px-4 border-b border-slate-700 flex justify-between items-center"><strong>CodeYau AI</strong><button id="aiClose" aria-label="Close AI"><i class="fa-solid fa-xmark"></i></button></div><div id="aiMessages" class="flex-1 overflow-auto p-4 space-y-3"></div><div class="p-3 border-t border-slate-700"><div class="flex gap-1 flex-wrap mb-2"><button class="aiQuick px-2 py-1 text-xs rounded bg-slate-800" data-prompt="Explain this code clearly.">Explain</button><button class="aiQuick px-2 py-1 text-xs rounded bg-slate-800" data-prompt="Find bugs in this code.">Bugs</button><button class="aiQuick px-2 py-1 text-xs rounded bg-slate-800" data-prompt="Improve this code.">Improve</button></div><textarea id="aiInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm" placeholder="Ask AI..." aria-label="AI prompt"></textarea><button id="aiSend" class="w-full mt-2 py-2.5 rounded-lg bg-violet-600">Ask AI</button></div></aside></div>
<div id="settingsModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4"><div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl"><div class="p-5 border-b border-slate-700 flex justify-between"><h2>Settings</h2><button id="settingsClose" aria-label="Close settings"><i class="fa-solid fa-xmark"></i></button></div><div class="p-5 space-y-4"><div><label class="block text-xs text-slate-400 mb-1">Gemini API key</label><input id="geminiKey" type="password" disabled placeholder="Managed securely by Cloudflare" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3"></div><div><label class="block text-xs text-slate-400 mb-1">Model</label><input id="geminiModel" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3" value="gemini-3.6-flash"></div><div class="flex justify-end gap-2"><button id="settingsCancel" class="px-4 py-2 bg-slate-800 rounded-lg">Cancel</button><button id="settingsSave" class="px-4 py-2 bg-indigo-600 rounded-lg">Save</button></div></div></div></div>
<div id="toast" class="fixed bottom-5 right-5 z-[60] translate-y-20 opacity-0 transition-all bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm"><span id="toastText"></span></div>
